<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ollama Router · Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f1a;
        --surface: #131625;
        --surface2: #1b1f35;
        --border: #252a45;
        --text: #e2e8f0;
        --muted: #7a85a3;
        --green: #4ade80;
        --red: #f87171;
        --yellow: #fbbf24;
        --blue: #60a5fa;
        --purple: #a78bfa;
        --cyan: #67e8f9;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        line-height: 1.5;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      .logo-icon {
        font-size: 1.375rem;
      }
      .logo h1 {
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .logo h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      .ws-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }
      .dot.connected {
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
        animation: blink 2.5s ease-in-out infinite;
      }
      .dot.reconnecting {
        background: var(--yellow);
      }
      .dot.disconnected {
        background: var(--red);
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ── Layout ── */
      main {
        padding: 2rem;
        max-width: 1440px;
        margin: 0 auto;
      }

      /* ── Summary ── */
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1.5rem;
        transition:
          border-color 0.2s,
          transform 0.2s;
      }
      .stat:hover {
        border-color: var(--blue);
        transform: translateY(-2px);
      }
      .stat-label {
        font-size: 0.6875rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .stat-val {
        font-size: 2.25rem;
        font-weight: 700;
        font-family: 'JetBrains Mono', monospace;
        line-height: 1;
      }
      .stat-sub {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 0.25rem;
      }
      .green {
        color: var(--green);
      }
      .blue {
        color: var(--blue);
      }
      .yellow {
        color: var(--yellow);
      }
      .red {
        color: var(--red);
      }
      .muted {
        color: var(--muted);
      }

      /* ── Node cards ── */
      .nodes {
        display: grid;
        gap: 1.25rem;
      }
      .node-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .node-card.ok {
        border-left: 3px solid var(--green);
      }
      .node-card.err {
        border-left: 3px solid var(--red);
        opacity: 0.75;
      }

      .node-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.875rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
      }
      .node-title {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      .node-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .node-dot.ok {
        background: var(--green);
        box-shadow: 0 0 7px var(--green);
      }
      .node-dot.err {
        background: var(--red);
      }
      .node-host {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .node-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      /* ── Badges ── */
      .badge {
        font-size: 0.6875rem;
        font-weight: 500;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.b-green {
        background: rgba(74, 222, 128, 0.1);
        border-color: var(--green);
        color: var(--green);
      }
      .badge.b-red {
        background: rgba(248, 113, 113, 0.1);
        border-color: var(--red);
        color: var(--red);
      }
      .badge.b-blue {
        background: rgba(96, 165, 250, 0.1);
        border-color: var(--blue);
        color: var(--blue);
      }
      .badge.b-yellow {
        background: rgba(251, 191, 36, 0.1);
        border-color: var(--yellow);
        color: var(--yellow);
      }

      /* ── Models table ── */
      .models-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
        table-layout: fixed;
      }
      /* Column widths – shared across all server tables so cells align */
      col.c-model      { width: 22%; }
      col.c-size       { width: 8%;  }
      col.c-params     { width: 8%;  }
      col.c-ctx        { width: 8%;  }
      col.c-caps       { width: 17%; }
      col.c-latency    { width: 9%;  }
      col.c-tps        { width: 8%;  }
      col.c-failures   { width: 8%;  }
      col.c-lastused   { width: 12%; }
      thead th {
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        text-align: left;
        padding: 0.625rem 1.5rem;
        background: rgba(0, 0, 0, 0.15);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      tbody td {
        padding: 0.8rem 1.5rem;
        font-size: 0.875rem;
        border-top: 1px solid rgba(37, 42, 69, 0.6);
        vertical-align: middle;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      tbody td.td-model { white-space: normal; }
      tbody td.td-caps  { white-space: normal; overflow: visible; }
      tbody tr:hover td {
        background: rgba(255, 255, 255, 0.025);
      }

      .model-name {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 0.875rem;
      }
      .model-fam {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 0.1rem;
      }

      /* ── Capability chips ── */
      .caps {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
      }
      .cap {
        font-size: 0.6875rem;
        font-weight: 500;
        padding: 0.15rem 0.45rem;
        border-radius: 5px;
      }
      .cap.vision {
        background: rgba(167, 139, 250, 0.15);
        color: var(--purple);
      }
      .cap.tools {
        background: rgba(96, 165, 250, 0.15);
        color: var(--blue);
      }
      .cap.thinking {
        background: rgba(251, 191, 36, 0.15);
        color: var(--yellow);
      }
      .cap.audio {
        background: rgba(103, 232, 249, 0.15);
        color: var(--cyan);
      }
      .cap.embedding {
        background: rgba(74, 222, 128, 0.15);
        color: var(--green);
      }

      /* ── Metrics ── */
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8125rem;
      }
      .good {
        color: var(--green);
      }
      .warn {
        color: var(--yellow);
      }
      .bad {
        color: var(--red);
      }

      /* ── Misc ── */
      .empty {
        padding: 2rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.875rem;
      }
      .footer {
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
        padding: 1.5rem 0 0.5rem;
      }
      @keyframes flash {
        from {
          background: rgba(96, 165, 250, 0.07);
        }
        to {
          background: transparent;
        }
      }
      .flash {
        animation: flash 0.5s ease-out;
      }

      /* ── Responsive ── */
      @media (max-width: 900px) {
        main {
          padding: 1.25rem;
        }
        .summary {
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 0.75rem;
          margin-bottom: 1.25rem;
        }
        .stat {
          padding: 1rem 1.1rem;
        }
        .stat-val {
          font-size: 1.75rem;
        }
      }

      @media (max-width: 600px) {
        header {
          padding: 0.75rem 1rem;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        main {
          padding: 1rem;
        }
        .summary {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.625rem;
        }
        .stat-val {
          font-size: 1.5rem;
        }
        .node-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.5rem;
          padding: 0.75rem 1rem;
        }
        .node-meta {
          width: 100%;
        }
        thead th,
        tbody td {
          padding-left: 1rem;
          padding-right: 1rem;
        }
      }

      @media (max-width: 400px) {
        .summary {
          grid-template-columns: 1fr 1fr;
        }
        .stat-val {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span class="logo-icon">🦙</span>
        <h1>Ollama Router <span>/ Dashboard</span></h1>
      </div>
      <div class="ws-status">
        <div class="dot" id="dot"></div>
        <span id="wsLabel">Connecting…</span>
      </div>
    </header>

    <main>
      <div class="summary">
        <div class="stat">
          <div class="stat-label">Nodes Online</div>
          <div class="stat-val green" id="sOnline">—</div>
          <div class="stat-sub" id="sTotal"></div>
        </div>
        <div class="stat">
          <div class="stat-label">Total Models</div>
          <div class="stat-val blue" id="sModels">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Active Requests</div>
          <div class="stat-val yellow" id="sReqs">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Latency</div>
          <div class="stat-val" id="sLatency">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg TPS</div>
          <div class="stat-val blue" id="sTps">—</div>
        </div>
      </div>

      <div class="nodes" id="nodes">
        <div class="empty">Waiting for data…</div>
      </div>

      <div class="footer" id="footer"></div>
    </main>

    <script>
      /* ─── WebSocket connection ─── */
      let ws, retryTimer

      function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws'
        ws = new WebSocket(`${proto}://${location.host}/ws`)
        ws.onopen = () => setDot('connected', 'Live')
        ws.onclose = () => {
          setDot('reconnecting', 'Reconnecting…')
          retryTimer = setTimeout(connect, 3000)
        }
        ws.onerror = () => setDot('disconnected', 'Error')
        ws.onmessage = (e) => {
          try {
            const m = JSON.parse(e.data)
            if (m.type === 'inventory') render(m.data)
          } catch {}
        }
      }

      function setDot(cls, label) {
        document.getElementById('dot').className = 'dot ' + cls
        document.getElementById('wsLabel').textContent = label
      }

      connect()

      /* ─── Formatting helpers ─── */
      const fmt = {
        bytes: (b) => (b > 0 ? (b / 1e9).toFixed(1) + ' GB' : '—'),
        ctx: (n) =>
          !n ? '—' : n >= 1000 ? (n / 1000).toFixed(0) + 'k' : String(n),
        ms: (ms) => (ms > 0 ? Math.round(ms) + ' ms' : '—'),
        tps: (t) => (t > 0 ? t.toFixed(1) : '—'),
        params: (p) => (p > 0 ? p.toFixed(1) + 'B' : '—'),
        ago: (ts) => {
          if (!ts) return '—'
          const d = Date.now() - ts
          if (d < 5000) return 'just now'
          if (d < 60000) return Math.floor(d / 1000) + 's ago'
          if (d < 3600000) return Math.floor(d / 60000) + 'm ago'
          return Math.floor(d / 3600000) + 'h ago'
        },
      }

      function latCls(ms) {
        if (!ms || ms <= 0) return 'muted'
        if (ms < 500) return 'good'
        if (ms < 2000) return 'warn'
        return 'bad'
      }

      function caps(profile) {
        const c = []
        if (profile.supportsVision)
          c.push('<span class="cap vision">👁 Vision</span>')
        if (profile.supportsTools)
          c.push('<span class="cap tools">🔧 Tools</span>')
        if (profile.supportsThinking)
          c.push('<span class="cap thinking">🧠 Thinking</span>')
        if (profile.supportsAudio)
          c.push('<span class="cap audio">🎵 Audio</span>')
        if (profile.isEmbedding)
          c.push('<span class="cap embedding">⚡ Embed</span>')
        return c.length
          ? '<div class="caps">' + c.join('') + '</div>'
          : '<span class="muted" style="font-size:.75rem">text</span>'
      }

      /* ─── Main render ─── */
      function render(data) {
        const nodeList = Object.values(data.nodes || {})
        const online = nodeList.filter((n) => n.reachable).length
        const allModels = nodeList.flatMap((n) => Object.values(n.models || {}))
        const totalReqs = nodeList.reduce(
          (s, n) => s + (n.activeRequests || 0),
          0,
        )
        const lats = allModels.map((m) => m.recentLatency).filter((v) => v > 0)
        const tpsList = allModels.map((m) => m.recentTps).filter((v) => v > 0)
        const avgLat = lats.length
          ? lats.reduce((a, b) => a + b, 0) / lats.length
          : 0
        const avgTps = tpsList.length
          ? tpsList.reduce((a, b) => a + b, 0) / tpsList.length
          : 0

        // Summary
        set('sOnline', online)
        set('sTotal', 'of ' + nodeList.length + ' configured')
        set('sModels', allModels.length)

        const rEl = document.getElementById('sReqs')
        rEl.textContent = totalReqs
        rEl.className = 'stat-val ' + (totalReqs > 0 ? 'yellow' : 'blue')

        const lEl = document.getElementById('sLatency')
        lEl.textContent = avgLat > 0 ? Math.round(avgLat) + ' ms' : '—'
        lEl.className = 'stat-val ' + (avgLat > 0 ? latCls(avgLat) : 'muted')

        const tEl = document.getElementById('sTps')
        tEl.textContent = avgTps > 0 ? avgTps.toFixed(1) : '—'

        // Nodes
        const nodesEl = document.getElementById('nodes')
        if (nodeList.length === 0) {
          nodesEl.innerHTML = '<div class="empty">No nodes configured.</div>'
        } else {
          nodesEl.innerHTML = nodeList.map((node) => nodeCard(node)).join('')
        }

        set(
          'footer',
          'Last update: ' + new Date(data.timestamp).toLocaleTimeString(),
        )
      }

      function nodeCard(node) {
        const ok = node.reachable
        const models = Object.values(node.models || {})
        const hostShort = node.host.replace(/^https?:\/\//, '')

        const badges = [
          ok
            ? '<span class="badge b-green">● Online</span>'
            : '<span class="badge b-red">● Offline</span>',
          node.activeRequests > 0
            ? `<span class="badge b-blue">⚡ ${node.activeRequests} active</span>`
            : '',
          `<span class="badge">${models.length} model${models.length !== 1 ? 's' : ''}</span>`,
        ].join('')

        const body =
          models.length === 0
            ? '<div class="empty">No models discovered on this node</div>'
            : `<div class="models-wrap">
          <table>
            <colgroup>
              <col class="c-model"><col class="c-size"><col class="c-params">
              <col class="c-ctx"><col class="c-caps"><col class="c-latency">
              <col class="c-tps"><col class="c-failures"><col class="c-lastused">
            </colgroup>
            <thead><tr>
              <th>Model</th><th>Size</th><th>Params</th><th>Context</th>
              <th>Capabilities</th><th>Latency</th><th>TPS</th>
              <th>Failures</th><th>Last used</th>
            </tr></thead>
            <tbody>${models.map(modelRow).join('')}</tbody>
          </table>
        </div>`

        return `<div class="node-card ${ok ? 'ok' : 'err'}">
      <div class="node-header">
        <div class="node-title">
          <div class="node-dot ${ok ? 'ok' : 'err'}"></div>
          <span class="node-host">${hostShort}</span>
        </div>
        <div class="node-meta">${badges}</div>
      </div>
      ${body}
    </div>`
      }

      function modelRow(m) {
        const p = m.profile || {}
        return `<tr>
      <td class="td-model">
        <div class="model-name">${m.name}</div>
        <div class="model-fam">${m.family || '—'}</div>
      </td>
      <td class="mono">${fmt.bytes(m.size)}</td>
      <td class="mono">${fmt.params(p.parameters)}</td>
      <td class="mono">${fmt.ctx(p.contextLength)}</td>
      <td class="td-caps">${caps(p)}</td>
      <td><span class="mono ${latCls(m.recentLatency)}">${fmt.ms(m.recentLatency)}</span></td>
      <td class="mono">${fmt.tps(m.recentTps)}</td>
      <td class="mono ${m.failures > 0 ? 'bad' : ''}">${m.failures || 0}</td>
      <td class="mono muted">${fmt.ago(m.lastRoutedAt)}</td>
    </tr>`
      }

      function set(id, val) {
        const el = document.getElementById(id)
        if (el) el.textContent = val
      }
    </script>
  </body>
</html>
